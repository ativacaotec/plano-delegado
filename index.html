      [9, 11, 3, "Vitimologia: vitimização, revitimização e síndromes"],
      [12, 13, 2, "Criminalização primária, secundária e terciária; cifras; prevenção"],
      [14, 16, 3, "Criminologias contemporâneas, mídia, discursos punitivos e abolicionismo"]
    ]},
    {"id": "civ", "nome": "Direito Civil", "cor": "#5A5A6E", "dias": "Sex e Sáb", "hsem": 1, "topicos": [
      [1, 3, 3, "LINDB: vigência, aplicação, conflito de leis no tempo e no espaço"],
      [4, 6, 3, "Pessoa natural, personalidade, capacidade, direitos da personalidade e domicílio"],
      [7, 8, 2, "Pessoa jurídica"],
      [9, 10, 2, "Bens e fato jurídico"],
      [11, 12, 2, "Prescrição e decadência"],
      [13, 14, 2, "Responsabilidade civil e danos material e moral"],
      [15, 16, 2, "CDC (consumidor e fornecedor) e Estatuto do Idoso"]
    ]},
    {"id": "sim", "nome": "Questões e simulados", "cor": "#333F48", "dias": "Sáb", "hsem": 2, "topicos": [
      [4, 4, 4.5, "Simulado completo 1: 80 questões FGV em 4h30"],
      [8, 8, 4.5, "Simulado completo 2: 80 questões FGV em 4h30"],
      [12, 12, 4.5, "Simulado completo 3: 80 questões FGV em 4h30"],
      [16, 16, 4.5, "Simulado completo 4: 80 questões FGV em 4h30"]
    ]}
  ],
  "fases": [
    ["Fase 1 - Base", "16 semanas (02/11/2026 a 20/02/2027)", "Grade semanal completa: 50% teoria, 20% lei seca, 30% questões FGV. 30 min de revisão espaçada no início de cada dia."],
    ["Fase 2 - Edital publicado", "8 a 12 semanas", "Comparar o novo conteúdo com o de 2024. 60% do tempo em questões FGV. 2 dissertativas por semana (Penal/Processo Penal e Administrativo/Constitucional, 20 linhas, com lei seca). Simulado completo a cada 2 semanas."],
    ["Fase 3 - Reta final", "4 semanas antes da objetiva", "Um simulado completo por semana, revisão de resumos, informativos do STF e do STJ e lei seca. Nada de matéria nova."],
    ["Fase 4 - Dissertativa e oral", "Após a objetiva", "Dissertativa: 3 respostas por dia nas 4 matérias. Oral: responder em voz alta, gravar e cronometrar 20 minutos por matéria."],
    ["Durante todo o plano", "Sempre", "Treinar para o teste físico (Cooper) e separar os comprovantes dos 3 anos de atividade jurídica ou policial."]
  ]
}
</script>
<script>
const P = JSON.parse(document.getElementById("dados").textContent);
const M = Object.fromEntries(P.materias.map(m => [m.id, m]));
const NOMES = { pen: "Penal", lpe: "Leg. Penal Extravagante", cpp: "Processo Penal", lppe: "Leg. Processual Extravagante", const: "Constitucional", adm: "Administrativo", lo: "Lei Orgânica", dh: "Direitos Humanos", ml: "Medicina Legal", crim: "Criminologia", civ: "Civil", sim: "Simulado", q: "Questões FGV", rev: "Revisão" };
const DIAS = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const HORAS_TOTAL = P.materias.reduce((s, m) => s + m.topicos.reduce((a, t) => a + t[2], 0), 0);
const TOTAL_TEMAS = P.materias.reduce((s, m) => s + m.topicos.length, 0);
const tid = (m, i) => m + "-" + (i + 1);

let estado = { t: {}, d: {}, inicio: P.inicio };
let aba = "hoje", cursor = null, confirmarZerar = false, statusTxt = "", backupAberto = false;

function lerLocal() { try { const s = localStorage.getItem("pcmg-progresso"); if (s) estado = Object.assign(estado, JSON.parse(s)); } catch (e) {} }
function gravarLocal() { try { localStorage.setItem("pcmg-progresso", JSON.stringify(estado)); } catch (e) {} }

// ---- datas e cronograma ----
const dataLocal = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function posicao(data) {
  const ini = dataLocal(estado.inicio);
  const dias = Math.round((data - ini) / 864e5);
  return { w: Math.floor(dias / 7) + 1, k: ((dias % 7) + 7) % 7 };
}
function tema(id, w) {
  const m = M[id]; const i = m.topicos.findIndex(t => w >= t[0] && w <= t[1]);
  return i < 0 ? null : { id: tid(id, i), txt: m.topicos[i][3], cont: w > m.topicos[i][0] };
}
function blocos(w, k) {
  const P_ = (id, dur) => ({ id, dur, tema: tema(id, w) });
  switch (k) {
    case 0: return [[P_("pen", "2h")], [P_("const", "1h30")]];
    case 1: return [[P_("cpp", "2h")], [P_("adm", "1h30")]];
    case 2: return [[P_("lpe", "2h")], [P_("dh", "1h30")]];
    case 3: return [[P_("lppe", "2h")], [P_("const", "1h"), P_("lo", "30 min")]];
    case 4: return [[P_("adm", "1h30"), P_("lo", "30 min")], [P_("ml", "1h"), P_("civ", "30 min")]];
    case 5: { const s = tema("sim", w); return [[s ? { id: "sim", dur: "4h30", tema: s } : { id: "q", dur: "2h", tema: { txt: "Questões mistas das matérias da semana", cont: false } }], [P_("crim", "1h"), P_("civ", "30 min")]]; }
  }
  return [];
}

// ---- progresso ----
function progresso() {
  let feitos = 0, horas = 0;
  for (const m of P.materias) m.topicos.forEach((t, i) => { if (estado.t[tid(m.id, i)]) { feitos++; horas += t[2]; } });
  return { feitos, horas, pct: Math.round(horas / HORAS_TOTAL * 100) };
}
function cabecalho() {
  const p = progresso();
  document.getElementById("pct").textContent = p.pct + "%";
  document.getElementById("anel").setAttribute("stroke-dashoffset", (138.2 * (1 - p.pct / 100)).toFixed(1));
  document.getElementById("resumo").textContent = `${p.feitos} de ${TOTAL_TEMAS} temas · ${String(p.horas).replace(".", ",")} de ${HORAS_TOTAL} h`;
}

// ---- telas ----
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fmtData = d => d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

function telaHoje() {
  if (!cursor) { cursor = new Date(); cursor.setHours(0, 0, 0, 0); }
  const { w, k } = posicao(cursor);
  let h = `<div class="card"><div class="daynav">
    <button class="btn" id="ant" aria-label="Dia anterior">‹</button>
    <div class="t"><div class="eyebrow">${w >= 1 && w <= P.semanas ? "Semana " + w + " de " + P.semanas : "Fora da Fase 1"}</div><h2>${esc(fmtData(cursor))}</h2></div>
    <button class="btn" id="prox" aria-label="Próximo dia">›</button></div>`;
  if (w < 1) h += `<p class="vazio">O plano começa em ${dataLocal(estado.inicio).toLocaleDateString("pt-BR")}. Use › para ver os primeiros dias.</p>`;
  else if (w > P.semanas) h += `<p class="vazio">As 16 semanas da Fase 1 terminaram. Siga as fases seguintes, na aba Edital.</p>`;
  else if (k === 6) h += `<p class="vazio">Domingo livre. Se perdeu algum dia na semana, este é o dia para repor.</p>`;
  else {
    const chave = w + "-" + k;
    const [a, b] = blocos(w, k);
    const linha = (rot, partes, sufixo) => {
      const id = chave + "-" + sufixo, ok = !!estado.d[id];
      return `<div class="bloco${ok ? " feito" : ""}"><input type="checkbox" class="chk" id="d-${id}" data-dia="${id}"${ok ? " checked" : ""} aria-label="${esc(rot)} feito"><div class="txt"><div class="lbl">${rot}</div>${partes.map(p => `<div class="parte"><b>${NOMES[p.id]}</b> <span class="dur">${p.dur}</span><br>${p.tema ? esc(p.tema.txt) + (p.tema.cont ? " (continuação)" : "") : ""}</div>`).join("")}</div></div>`;
    };
    h += linha("Revisão · 30 min", [{ id: "rev", dur: "", tema: { txt: "Revisão espaçada (ontem, 7 e 30 dias atrás) e lei seca" } }], "r");
    h += linha("Bloco A", a, "a") + linha("Bloco B", b, "b");
    // temas da semana
    const ids = new Set();
    for (let kk = 0; kk < 6; kk++) for (const bl of blocos(w, kk)) for (const p of bl) if (p.tema && p.tema.id) ids.add(p.id + "|" + p.tema.id);
    h += `</div><div class="card"><div class="eyebrow">Temas desta semana</div><p class="nota" style="margin:4px 0 0">Marque quando terminar o tema inteiro. Temas longos ocupam mais de uma semana.</p>`;
    for (const x of ids) { const [mid, t] = x.split("|"); const i = Number(t.split("-").pop()) - 1; h += temaLinha(mid, i, true); }
  }
  h += `</div>`;
  return h;
}
function temaLinha(mid, i, comNome) {
  const m = M[mid], t = m.topicos[i], id = tid(mid, i), ok = !!estado.t[id];
  const sem = t[0] === t[1] ? "Semana " + t[0] : "Semanas " + t[0] + " a " + t[1];
  return `<div class="tema${ok ? " feito" : ""}" style="padding-inline:0"><input type="checkbox" class="chk" id="t-${id}" data-tema="${id}"${ok ? " checked" : ""} aria-label="Tema estudado"><div class="txt">${comNome ? `<b>${esc(NOMES[mid])}</b><br>` : ""}${esc(t[3])}<div class="meta">${sem} · ${String(t[2]).replace(".", ",")} h</div></div></div>`;
}
function telaMaterias() {
  let h = "";
  for (const m of P.materias) {
    const n = m.topicos.filter((t, i) => estado.t[tid(m.id, i)]).length;
    let abertos = []; try { abertos = JSON.parse(localStorage.getItem("pcmg-abertos") || "[]"); } catch (e) {}
    h += `<details class="mat" data-mat="${m.id}"${abertos.includes(m.id) ? " open" : ""}><summary><span class="mnome"><span class="dot" style="background:${m.cor}"></span>${esc(m.nome)}</span><span class="mcont">${n}/${m.topicos.length}</span><span class="barra"><i style="width:${n / m.topicos.length * 100}%"></i></span></summary>`;
    m.topicos.forEach((t, i) => { h += temaLinha(m.id, i, false).replace('style="padding-inline:0"', ""); });
    h += `</details>`;
  }
  return h;
}
function telaEdital() {
  const e = P.edital;
  let h = `<div class="card"><div class="eyebrow">Baixar o plano</div><p class="nota" style="margin:4px 0 0">O mesmo plano em planilha e em PDF.</p>
  <div class="campo"><a class="btn prim" href="Plano_Delegado_PCMG.xlsx" download style="text-decoration:none">Planilha (Excel)</a><a class="btn prim" href="Plano_Delegado_PCMG.pdf" target="_blank" rel="noopener" style="text-decoration:none">PDF</a></div></div>`;
  h += `<div class="card"><div class="eyebrow">Último edital</div><h2>${esc(e.nome)}</h2><p class="nota">${esc(e.vagas)}. ${esc(e.requisitos)}.</p>
  <table class="tbl">${e.objetiva.map(o => `<tr><td>${esc(o[0])}</td><td class="n">${o[1]}</td></tr>`).join("")}<tr><td><b>Total da objetiva</b> · mínimo de 48</td><td class="n">80</td></tr></table></div>`;
  h += `<div class="card"><div class="eyebrow">Etapas</div>${e.etapas.map(x => `<div class="etapa"><b>${esc(x[0])}</b><span class="nota">${esc(x[1])}</span></div>`).join("")}</div>`;
  h += `<div class="card"><div class="eyebrow">Fases do plano</div>${P.fases.map(f => `<div class="etapa"><b>${esc(f[0])}</b><span class="nota">${esc(f[1])}. ${esc(f[2])}</span></div>`).join("")}</div>`;
  h += `<div class="card"><div class="eyebrow">Ajustes</div><div class="campo"><label for="inicio">Início do plano (uma segunda-feira)</label><input type="date" id="inicio" value="${estado.inicio}"></div>
  <div class="campo"><span class="status" id="status">${esc(statusTxt)}</span></div>
  <div class="campo"><button class="btn" id="backup">${backupAberto ? "Fechar backup" : "Backup das marcações"}</button></div>
  ${backupAberto ? `<p class="nota" style="margin:10px 0 4px">Para guardar: copie o código abaixo e mande para você mesmo no WhatsApp. Para restaurar em outro celular: cole o código aqui e toque em Restaurar.</p>
  <textarea id="codigo" rows="4" style="width:100%;font:12px ui-monospace,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">${esc(codigoBackup())}</textarea>
  <div class="campo"><button class="btn prim" id="copiar">Copiar código</button><button class="btn" id="restaurar">Restaurar</button></div>` : ""}
  ${confirmarZerar ? `<div class="confirma"><span>Apagar todas as marcações?</span><button class="btn perigo" id="zerar-sim">Apagar</button><button class="btn" id="zerar-nao">Cancelar</button></div>` : `<div class="campo"><button class="btn perigo" id="zerar">Zerar marcações</button></div>`}</div>`;
  return h;
}
function render() {
  const el = document.getElementById("tela");
  el.innerHTML = aba === "hoje" ? telaHoje() : aba === "materias" ? telaMaterias() : telaEdital();
  document.querySelectorAll("nav.abas button").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === aba ? "true" : "false"));
  cabecalho();
}

// ---- eventos ----
document.querySelector("nav.abas").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; aba = b.dataset.aba; confirmarZerar = false; render(); window.scrollTo(0, 0); });
document.getElementById("tela").addEventListener("click", e => {
  const id = e.target.id;
  if (id === "ant" || id === "prox") { cursor.setDate(cursor.getDate() + (id === "ant" ? -1 : 1)); render(); }
  if (id === "backup") { backupAberto = !backupAberto; render(); }
  if (id === "copiar") {
    const ta = document.getElementById("codigo");
    const ok = () => setStatus("Código copiado. Cole no WhatsApp para guardar.");
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(ok, () => { ta.select(); setStatus("Selecionei o código: toque em Copiar."); });
    else { ta.select(); setStatus("Selecionei o código: toque em Copiar."); }
  }
  if (id === "restaurar") {
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("codigo").value.trim()))));
      if (!d || typeof d.t !== "object") throw 0;
      estado = { t: d.t || {}, d: d.d || {}, inicio: d.inicio || P.inicio }; cursor = null; backupAberto = false; salvar(); render();
      setStatus("Marcações restauradas.");
    } catch (err) { setStatus("Código inválido. Confira se colou o código inteiro."); }
  }
  if (id === "zerar") { confirmarZerar = true; render(); }
  if (id === "zerar-nao") { confirmarZerar = false; render(); }
  if (id === "zerar-sim") { estado.t = {}; estado.d = {}; confirmarZerar = false; salvar(); render(); }
});
document.getElementById("tela").addEventListener("change", e => {
  const x = e.target;
  if (x.dataset.tema) { if (x.checked) estado.t[x.dataset.tema] = 1; else delete estado.t[x.dataset.tema]; salvar(); render(); }
  else if (x.dataset.dia) { if (x.checked) estado.d[x.dataset.dia] = 1; else delete estado.d[x.dataset.dia]; salvar(); render(); }
  else if (x.id === "inicio" && x.value) { estado.inicio = x.value; cursor = null; salvar(); render(); }
});
document.getElementById("tela").addEventListener("toggle", e => {
  if (!e.target.matches || !e.target.matches("details.mat")) return;
  const abertos = [...document.querySelectorAll("details.mat[open]")].map(d => d.dataset.mat);
  try { localStorage.setItem("pcmg-abertos", JSON.stringify(abertos)); } catch (err) {}
}, true);

// ---- salvamento neste aparelho ----
function setStatus(t) { statusTxt = t; const s = document.getElementById("status"); if (s) s.textContent = t; }
function salvar() { gravarLocal(); }
function codigoBackup() { return btoa(unescape(encodeURIComponent(JSON.stringify({ t: estado.t, d: estado.d, inicio: estado.inicio })))); }
async function guardarDeVez() {
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

lerLocal(); render(); guardarDeVez();
setStatus("As marcações ficam salvas neste celular. Use o backup para guardar uma cópia.");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body></html>
